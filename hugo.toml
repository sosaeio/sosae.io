baseURL = 'https://sosae.io/'
locale = 'en-us'
title = 'sosae.io'
theme = 'PaperMod'
enableRobotsTXT = true
refLinksErrorLevel = 'ERROR'   # a broken internal link fails the build

[pagination]
  pagerSize = 20

[params]
  description = 'Firmware and systems software, from the register up.'
  author = 'Esosa Ekhoragbon'
  defaultTheme = 'auto'        # follows the reader's light/dark setting
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowReadingTime = false
  ShowShareButtons = false
  ShowBreadCrumbs = false
  hideSummary = true           # homepage shows titles and dates, not excerpts
  disableSpecial1stPost = true
  hideAuthor = true

  # [params.homeInfoParams]
  #   Title = 'sosae.io'
  #   Content = 'Notes on firmware and systems software, written as I build.'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/sosaeio'
  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/esosae'

[menu]
  [[menu.main]]
    name = 'Archive'
    url = '/archives/'
    weight = 10
  [[menu.main]]
    name = 'Tags'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    name = 'About'
    url = '/about/'
    weight = 30

